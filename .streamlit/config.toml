[theme]
base = "dark"
primaryColor = "#2fd3f0"
backgroundColor = "#060b16"
secondaryBackgroundColor = "#111b30"
textColor = "#eaf0fa"
linkColor = "#2fd3f0"
borderColor = "#24324f"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"
baseFontSize = 16
font = "Atkinson Hyperlegible Next:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap"
headingFont = "Saira:https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&display=swap"
redColor = "#ff5a6e"
greenColor = "#2fe08f"
blueColor = "#4292f4"
orangeColor = "#ffb648"
violetColor = "#a08cff"
chartCategoricalColors = ["#4292f4", "#e7672b", "#2fd3f0", "#ffb648"]

[theme.sidebar]
backgroundColor = "#08101e"
secondaryBackgroundColor = "#111b30"
borderColor = "#1e2b47"
